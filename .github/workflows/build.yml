name: Build and Publish Docker Image

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      invidious_ver: ${{ steps.extract.outputs.invidious_ver }}
      companion_ver: ${{ steps.extract.outputs.companion_ver }}
      image_base: ${{ steps.extract.outputs.image_base }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract versions from Dockerfile donor digests
        id: extract
        env:
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          IMAGE_BASE=$(printf '%s\n' "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')
          INVIDIOUS_REF=$(sed -nE 's|^FROM (quay\.io/invidious/invidious:[^ ]+) AS invidious-donor-amd64$|\1|p' Dockerfile | sed -E 's/:[^@]+@/@/')
          COMPANION_REF=$(sed -nE 's|^FROM (quay\.io/invidious/invidious-companion:[^ ]+) AS companion-donor$|\1|p' Dockerfile | sed -E 's/:[^@]+@/@/')

          if [ -z "$INVIDIOUS_REF" ] || [ -z "$COMPANION_REF" ]; then
            printf 'ERROR: missing donor image references in Dockerfile\n' >&2
            exit 1
          fi

          INVIDIOUS_VER=$(skopeo inspect --config "docker://${INVIDIOUS_REF}" | jq -r '.config.Labels["org.opencontainers.image.version"] // empty')
          COMPANION_VER=$(skopeo inspect --config "docker://${COMPANION_REF}" | jq -r '
            if (.config.Labels["org.opencontainers.image.version"] // "latest") != "latest" then
              .config.Labels["org.opencontainers.image.version"]
            else
              ((.config.Labels["org.opencontainers.image.created"] // "")[0:10] | gsub("-"; ".")) + "-" + ((.config.Labels["org.opencontainers.image.revision"] // "")[0:7])
            end
          ')

          INVIDIOUS_VER="${INVIDIOUS_VER#v}"
          COMPANION_VER="${COMPANION_VER#v}"

          if [[ ! "$INVIDIOUS_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-fA-F]+)?$ ]]; then
            printf 'ERROR: invalid or missing Invidious version: %s\n' "$INVIDIOUS_VER" >&2
            exit 1
          fi

          if [[ ! "$COMPANION_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-fA-F]+)?$ ]]; then
            printf 'ERROR: invalid or missing Companion version: %s\n' "$COMPANION_VER" >&2
            exit 1
          fi

          printf 'invidious_ver=%s\n' "$INVIDIOUS_VER" >> "$GITHUB_OUTPUT"
          printf 'companion_ver=%s\n' "$COMPANION_VER" >> "$GITHUB_OUTPUT"
          printf 'image_base=%s\n' "$IMAGE_BASE" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            push_tag_suffix: -amd64
          - platform: linux/arm64
            push_tag_suffix: -arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Invidious platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: invidious
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ needs.prepare.outputs.image_base }}:${{ needs.prepare.outputs.invidious_ver }}${{ matrix.push_tag_suffix }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Companion platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: companion
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ needs.prepare.outputs.image_base }}:companion-${{ needs.prepare.outputs.companion_ver }}${{ matrix.push_tag_suffix }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    name: Merge fat manifests
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Invidious multi-arch manifest
        env:
          BASE: ${{ needs.prepare.outputs.image_base }}
          VER: ${{ needs.prepare.outputs.invidious_ver }}
        run: |
          docker buildx imagetools create \
            --tag "${BASE}:${VER}" \
            --tag "${BASE}:latest" \
            "${BASE}:${VER}-amd64" \
            "${BASE}:${VER}-arm64"

      - name: Create Companion multi-arch manifest
        env:
          BASE: ${{ needs.prepare.outputs.image_base }}
          COMP_VER: ${{ needs.prepare.outputs.companion_ver }}
        run: |
          docker buildx imagetools create \
            --tag "${BASE}:companion-${COMP_VER}" \
            --tag "${BASE}:companion-latest" \
            --tag "${BASE}:companion" \
            "${BASE}:companion-${COMP_VER}-amd64" \
            "${BASE}:companion-${COMP_VER}-arm64"
